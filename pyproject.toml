[project]
name = "citation-needed"
version = "0.1.0"
description = "Citation trail for every discrete choice embedded in LLM-facing files (skills, memories, rules, CLAUDE.md files, plans)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[project.scripts]
cite = "citation_needed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_needed"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests hit real external APIs and are excluded from the default run;
# run them explicitly once via `uv run pytest -m live` (CLI -m overrides addopts).
addopts = "-q -m 'not live'"
markers = [
    "live: hits real external APIs (S2/Crossref); excluded by default, run via -m live",
]
